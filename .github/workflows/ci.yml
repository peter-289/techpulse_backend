name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -q

  # DDD layer boundaries. Kept as its own job, and as a separate step from the
  # test suite, so a boundary regression is reported as an architecture
  # failure rather than being buried among test failures. The ratchet in
  # tests/architecture/ratchet.json can only shrink; see
  # docs/adr/0004-enforce-layer-boundaries-with-a-ratchet.md.
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Report layer-boundary violations
        run: python -m tests.architecture.layer_rules

      - name: Enforce layer boundaries
        run: python -m pytest tests/architecture -q

  alembic-check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: techpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply migrations
        env:
          DATABASE_URL_ASYNC: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/techpulse
          DATABASE_URL_SYNC: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/techpulse
          SECRET_KEY: ci-secret-key-not-for-production-use-0123456789abcd
          EMAIL_VERIFY_SECRET: ci-email-verify-secret-not-for-production-0123456789
          PASSWORD_RESET_SECRET: ci-password-reset-secret-not-for-production-012345678
        run: python -m alembic upgrade head

      - name: Check models match migrations
        env:
          DATABASE_URL_ASYNC: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/techpulse
          DATABASE_URL_SYNC: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/techpulse
          SECRET_KEY: ci-secret-key-not-for-production-use-0123456789abcd
          EMAIL_VERIFY_SECRET: ci-email-verify-secret-not-for-production-0123456789
          PASSWORD_RESET_SECRET: ci-password-reset-secret-not-for-production-012345678
        run: python -m alembic check
